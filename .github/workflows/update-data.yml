name: Update EUR/USD Market Data

on:
  schedule:
    - cron: '0 8 * * 1-5' # Runs every weekday at 08:00 UTC
  workflow_dispatch: # Allows manual trigger from GitHub interface

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install yfinance

      - name: Run data fetcher script
        run: python update-data.py

      - name: Commit and push if data changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated market data update: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" && git push)
